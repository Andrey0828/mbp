<script id="answer-review-data" type="application/json">{"1": {"status": "ok", "note": "Ответ соответствует описанию пула и дорожек в курсе: пул ограничивает процесс; дорожки показывают роли исполнителей и могут быть горизонтальными или вертикальными. Указание «в основном до 4–5» в №39 — учебная рекомендация, не предел стандарта.", "pages": [148, 149, 150, 151], "external": []}, "2": {"status": "missing", "note": "Исходное изображение не сохранилось в PDF. Нельзя независимо проверить соответствие ответа символу или схеме. Добавленная в тест учебная иллюстрация построена по ответу и не является независимым доказательством. Метки сервиса приведены ниже отдельно от результата содержательной проверки. После полной проверки вопрос исключён из оценки; прежние варианты доступны только справочно.", "pages": [], "external": []}, "3": {"status": "ok", "note": "Все четыре соответствия верны: стандарт, инструкция, регламент, система. Первые три определения приведены в лекции; последнее описывает систему как взаимосвязанное целое.", "pages": [116, 117, 123], "external": []}, "4": {"status": "ok", "note": "Все три соответствия воспроизводят определения курса: узел диалога — пул/участник, диалог — информационное взаимодействие, схема диалога — взаимосвязь пулов. Оценивается терминология лекции.", "pages": [242, 243], "external": []}, "5": {"status": "ok", "note": "eEPC предназначена для детального описания последовательности функций и событий в подразделении или между исполнителями.", "pages": [293, 304], "external": []}, "6": {"status": "missing", "note": "Исходное изображение не сохранилось в PDF. Нельзя независимо проверить соответствие ответа символу или схеме. Добавленная в тест учебная иллюстрация построена по ответу и не является независимым доказательством. Метки сервиса приведены ниже отдельно от результата содержательной проверки. После полной проверки вопрос исключён из оценки; прежние варианты доступны только справочно.", "pages": [], "external": []}, "7": {"status": "ok", "note": "Верно: WFD — Work Flow Diagram, диаграмма потоков работ; главные объекты — действия, а не потоки данных.", "pages": [369, 378], "external": []}, "8": {"status": "ok", "note": "Соответствия верны для учебного способа построения BPMN: название процесса — пул; исполнители — дорожки; действия — задачи; результат — конечное событие. В №8 расписание задаёт старт-таймер. В №31 помощник не выполняет действий процесса и отдельная дорожка ему не нужна. Название организации не подменяет название процесса в принятой в курсе схеме.", "pages": [149, 150, 151, 154, 155, 156, 161], "external": []}, "9": {"status": "fixed", "note": "Два соответствия уже исправлены: название процесса — развёрнутый пул; название нотариальной конторы — не отражается в графической модели процесса. Все пять текущих пар согласуются с исходными отметками и учебным правилом именования пула. Это соглашение задания, а не общий запрет на название организации в пуле BPMN.", "pages": [149, 150, 151, 161], "external": []}, "10": {"status": "ok", "note": "Определение дословно соответствует бизнес-процессам, существующим в любой функциональной области: планирование, контроль и анализ работы в зоне ответственности конкретного лица.", "pages": [108], "external": []}, "11": {"status": "error", "note": "Ошибка в строке «посетитель»: для данного учебного eEPC требуется «не отражается на модели», а не Role. На с. 328 лекции внешние участники исключены из eEPC; то же соответствие подтверждается аналогичным №120. Остальные четыре строки верны. Это ограничение курса, не универсальное правило всех вариантов EPC.", "pages": [278, 328], "external": []}, "12": {"status": "ok", "note": "Проверено прямым сложением: 250 + 350 + 1100 = 1700. Текущий ответ верен.", "pages": [], "external": []}, "13": {"status": "ok", "note": "Функциональный элемент IDEF3 обозначает действие, работу или событие; выбранный вариант соответствует лекции.", "pages": [61, 62], "external": []}, "14": {"status": "ok", "note": "Данные связывают "207": {"status": "ok", "note": "Верно: стартовое событие задаёт начало процесса; в него не входит поток управления. Это ограничение относится к Sequence Flow, а не к получению стартового сообщения.", "pages": [154, 177], "external": []}, "208": {"status": "ok", "note": "Верно: структуру подразделений и должностей описывает организационная модель.", "pages": [271, 363], "external": []}, "209": {"status": "missing", "note": "Исходное изображение не сохранилось в PDF. Нельзя независимо проверить соответствие ответа символу или схеме. Добавленная в тест учебная иллюстрация построена по ответу и не является независимым доказательством. Метки сервиса приведены ниже отдельно от результата содержательной проверки. После полной проверки вопрос исключён из оценки; прежние варианты доступны только справочно.", "pages": [], "external": []}, "210": {"status": "ok", "note": "Все коды проверены по условию: выход O1, вход I1, исполнитель M1, технологический регламент C1. Для каждой категории указан один объект, поэтому индексы однозначны. Гипотеза №210 подтверждается.", "pages": [24, 25], "external": []}, "211": {"status": "ok", "note": "Ответы соответствуют правилам eEPC курса: чередование событий и функций; ветвления/слияния через логические операторы; начало/конец — событие или интерфейс. Ограничение одного входа/выхода относится к внутренним узлам, у начального события нет входа, у конечного нет выхода.", "pages": [305, 307, 317, 318, 319], "external": []}, "212": {"status": "ok", "note": "Соответствия проверены по смыслу каждого элемента: должность — Role, конкретный сотрудник — Person, организация/отдел — Organizational unit, адрес — Location, действие — Activity, состояние/результат — Event, документ — Document. В №71 не участвующий в процессе помощник не отражается; в №120 внешний посетитель не отражается по правилу курса.", "pages": [278, 293, 314, 315, 328, 329], "external": []}}</script>
<script>
'use strict';
const ANSWER_REVIEWS=JSON.parse(document.getElementById("answer-review-data").textContent);
const ILLUSTRATIONS=JSON.parse(document.getElementById("illustration-data").textContent);
const DATA=JSON.parse(document.getElementById('quiz-data').textContent);
const STORE='syncshare-938416-v1';
let state={current:1,answers:{},checked:{},filter:'all',search:'',view:'quiz',reveal:false};
try{const s=JSON.parse(localStorage.getItem(STORE)||'null');if(s&&s.version===1)state={...state,...s,view:'quiz',filter:'all',search:''};}catch{}
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').trim().toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ');
function answer(q){return state.answers[q.id];}
function filled(q){const a=answer(q);return q.type==='match'?Array.isArray(a)&&q.rows.every((_,i)=>Number.isInteger(a[i])):q.type==='radio'?Number.isInteger(a):typeof a==='string'&&a.trim()!=='';}
function started(q){const a=answer(q);return q.type==='match'?Array.isArray(a)&&a.some(x=>Number.isInteger(x)):q.type==='radio'?Number.isInteger(a):typeof a==='string'&&a.trim()!=='';}
function valid(q){if(q.basis==='unavailable')return null;const a=answer(q);if(!filled(q))return false;if(q.type==='match')return q.rows.every((r,i)=>r.answer.includes(a[i]));if(q.type==='text')return q.answer.some(x=>norm(x)===norm(a));return q.answer.includes(a);}
function save(){try{localStorage.setItem(STORE,JSON.stringify({...state,version:1}));$('save-state').textContent='Прогресс сохранён в этом браузере';}catch{$('save-state').textContent='Сохранение недоступно — не закрывайте вкладку';}}
function searchMatches(q,text){
 const numbered=text.match(/^(?:№\s*|вопрос\s*)?(\d+)$/);
 if(numbered)return q.id===Number(numbered[1]);
 const haystack=norm(q.prompt+' '+q.options.join(' ')+' '+(q.rows||[]).map(r=>r.left).join(' ')+' '+(q.candidates||[]).map(c=>c.value).join(' ')).replace(/[^\p{L}\p{N}]+/gu,' ');
 return text.split(/[^\p{L}\p{N}]+/u).filter(Boolean).every(word=>haystack.includes(word));
}
function list(){const text=norm(state.search);return DATA.filter(q=>text?searchMatches(q,text):(state.filter==='all'||state.filter===q.basis||(state.filter==='errors'&&(state.reviewIds||[]).includes(q.id))));}
function showSearchResults(){
 const text=norm(state.search),arr=list();
 $('search-status').textContent=text?`Найдено: ${arr.length}`:'';
 $('search-results').classList.toggle('hidden',!text);
 $('search-results').innerHTML=text?arr.map(q=>`<button data-result="${q.id}"><strong>№ ${q.id}</strong><span>${esc(q.prompt.length>180?q.prompt.slice(0,180)+'…':q.prompt)}</span></button>`).join(''):'';
}
function refreshNav(){$('unavailable-count').textContent=DATA.filter(q=>q.basis==='unavailable').length;const n=DATA.filter(filled).length;const errors=DATA.filter(q=>state.checked[q.id]&&filled(q)&&valid(q)===false).length;$('progress-text').textContent=`Заполнено ${n} из 212`;$('bar').style.width=(n/212*100)+'%';$('error-count').textContent=errors;const arr=list();$('nav-count').textContent=`(${arr.length})`;$('numbers').innerHTML=arr.map(q=>{const v=state.checked[q.id]?valid(q):null;const cls=[q.id===state.current?'current':'',q.basis==='guess'?'hyp':'',v===true?'yes':v===false&&filled(q)?'no':started(q)?'done':''].join(' ');return `<button class="${cls}" data-id="${q.id}" aria-label="Вопрос ${q.id}${q.basis==='guess'?', моя гипотеза':''}${state.checked[q.id]&&filled(q)?v===true?', совпал с ключом':v===false?', не совпал с ключом':'':''}" ${q.id===state.current?'aria-current="true"':''}>${q.id}</button>`;}).join('');document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('active',b.dataset.filter===state.filter);b.setAttribute('aria-pressed',String(b.dataset.filter===state.filter));});}
function badge(q){return `<span class="badge ${q.basis}">${q.basis==='unavailable'?'Без оценки':q.correction?'Ключ исправлен':'Проверено по курсу'}</span>`;}
function leaders(q,r=q){return r.answer.map(i=>q.options[i]).join(' / ');}
function voteTable(q,r=q){const rows=q.type==='text'?q.candidates:q.options.map((o,i)=>({value:o,votes:r.votes[i]}));return `<table><thead><tr><th scope="col">Вариант</th><th scope="col">Голоса</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.value)}</td><td>${r.votes}</td></tr>`).join('')}</tbody></table>`;}
function referenceKey(q){
 const hasKey=q.type==='match'?q.rows.some(r=>r.answer.length):q.answer.length;
 if(!hasKey)return '';
 const content=q.type==='match'?'<dl>'+q.rows.map(r=>`<dt>${esc(r.left)}</dt><dd>${esc(leaders(q,r))||'Нет данных'}</dd>`).join('')+'</dl>':`<p>${esc(q.type==='text'?q.answer.join(' / '):leaders(q))}</p>`;
 return `<details class="reference-key"><summary>Прежний неподтверждённый ключ — справочно</summary>${content}<p class="small">Не используется для оценки. Это предположение из статистики или предыдущей реконструкции.</p></details>`;
}
function optionInfo(q,i){
 const selected=q.answer.includes(i);
 const label=selected?(q.basis==='unavailable'?' · прежний ключ, не подтверждён':' · проверенный ответ'):'';
 return `${q.votes[i]} голосов${label}`;
}
function feedback(q){
 if(!state.checked[q.id]&&!state.reveal)return '';
 if(q.basis==='unavailable')return `<div class="feedback"><strong>Без оценки</strong><p>${esc(q.reason)}</p>${referenceKey(q)}</div>`;
 const v=valid(q),heading=!filled(q)?'Ответ не заполнен':v?'Правильно':'Неправильно';
 const details=q.type!=='match'?`<p>Проверенный ответ: <strong>${esc(q.type==='text'?q.answer.join(' / '):leaders(q))}</strong></p>`:'';
 return `<div class="feedback ${v?'good':'bad'}" role="status"><h3>${heading}</h3>${details}</div>`;
}

function illustration(q,placement='answer'){
 const f=ILLUSTRATIONS[q.id];
 if(!f)return '';
 const inQuestion=placement==='question';
 return `<figure class="answer-figure ${inQuestion?'question-figure':''}" data-illustration="${q.id}" data-illustration-role="${placement}"><span class="figure-badge">Создано по ответу</span><img src="${f.src}" alt="${esc(f.title+'. '+f.description)}" width="420" height="${[34,165,192].includes(q.id)?290:[22,46,121].includes(q.id)?260:q.id===131?250:240}" loading="lazy" decoding="async"><figcaption>${inQuestion?'':`<strong>${esc(f.title)}</strong>${esc(f.description)}`}<span class="figure-origin">${inQuestion?'Учебная реконструкция. Оригинал в PDF отсутствует.':'Учебная иллюстрация по ответу. Оригинальная картинка в PDF отсутствует.'}</span></figcaption></figure>`;
}
function optionGuide(q){
 if(![24,27].includes(q.id))return '';
 const diamond='<path d="M50 8 92 50 50 92 8 50Z"/>';
 const cross='<path d="M37 37 63 63M63 37 37 63" stroke-width="5"/>';
 const circle=(double=false,thick=false)=>`<circle cx="50" cy="50" r="38" stroke-width="${thick?6:2}"/>${double?'<circle cx="50" cy="50" r="32" stroke-width="2"/>':''}`;
 const envelope=(filled=false)=>`<rect x="29" y="35" width="42" height="30" fill="${filled?'#283344':'white'}"/><path d="m29 35 21 17 21-17" stroke="${filled?'white':'#283344'}"/>`;
 const clock='<circle cx="50" cy="50" r="23"/><path d="M50 30v5M70 50h-5M50 70v-5M30 50h5M36 36l4 4M64 36l-4 4M64 64l-4-4M36 64l4-4M50 37v13h13"/>';
 const items=q.id===24?[
  [diamond+'<path d="M50 31v38M31 50h38" stroke-width="5"/>','BPMN · AND','Ромб с плюсом. При разветвлении запускает все ветви параллельно.'],
  [diamond+'<circle cx="50" cy="50" r="20" stroke-width="3"/>','BPMN · OR','Ромб с кругом. При разветвлении выбирает одну или несколько ветвей.'],
  [diamond+cross,'BPMN · XOR','Ромб с X. Выбирает только одну ветвь. Допустим также пустой ромб.'],
  ['<rect x="17" y="17" width="66" height="66"/><path d="M25 17v66"/>'+cross,'IDEF3 · XOR','Квадрат с X. Только одна альтернативная ветвь. Это перекрёсток IDEF3, а не шлюз BPMN.']
 ]:[
  [circle(),'BPMN · начало','Один тонкий круг, без значка. Начало процесса без указанного типа события.'],
  [circle()+envelope(),'BPMN · начало','Один тонкий круг с конвертом. Процесс запускается при получении сообщения.'],
  [circle(true),'BPMN · промежуточное','Два тонких круга, без значка. Неспециализированное событие в ходе процесса.'],
  [circle(true)+envelope(true),'BPMN · промежуточное','Два круга с конвертом. Сообщение в ходе процесса; здесь конверт закрашен, как в лекции.'],
  [circle(false,true),'BPMN · завершение','Один толстый круг. Завершение ветви процесса.'],
  [circle(true)+clock,'BPMN · промежуточное','Два круга с часами. Ожидание указанного времени или срока.']
 ];
 return `<section class="option-guide" data-option-guide="${q.id}" aria-labelledby="guide-title-${q.id}"><h3 id="guide-title-${q.id}">Как выглядят варианты ответа</h3><p class="guide-intro">Учебные образцы по названиям вариантов. Они не восстанавливают пропавшие картинки и их порядок в задании.</p><div class="guide-grid">${items.map(([shape,notation,description],i)=>{const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g fill="white" stroke="#283344" stroke-width="2.5" stroke-linejoin="round">${shape}</g></svg>`;return `<figure class="guide-item" data-option-index="${i}"><img width="80" height="80" src="data:image/svg+xml,${encodeURIComponent(svg)}" alt="${esc(q.options[i]+': '+description)}"><figcaption><span class="guide-notation">${notation}</span><strong>${esc(q.options[i])}</strong><span>${description}</span></figcaption></figure>`;}).join('')}</div><p class="guide-source">По лекциям курса: страницы PDF ${q.id===24?'163 и 75':'153–160'}. Цвет фона выделяет учебный справочник, а не правильный ответ.</p></section>`;
}
function selectionMessage(q){
 if(q.basis==='unavailable')return 'Без оценки: исходное изображение отсутствует.';
 return valid(q)?'Правильно по проверенному ключу.':'Неправильно по проверенному ключу.';
}
function illustrationNote(q){
 if(!q.missingImage||ILLUSTRATIONS[q.id])return '';
 return '<p class="figure-note">Без исходной картинки нельзя подтвердить ответ. Вопрос не влияет на результат попытки.</p>';
}
function answerReview(q){
 if(q.correction)return `<section class="answer-review review-ok" data-key-correction="${q.id}" aria-label="Исправление ключа"><h3>Уточнение после проверки</h3><p>${esc(q.correction)}</p></section>`;
 const r=ANSWER_REVIEWS[q.id];if(!r)return '';
 const titles={ok:'Ответ проверен',fixed:'Ключ исправлен',caveat:'Проверка: есть оговорка',missing:'Для проверки нужна исходная картинка',partial:'Ответ проверен частично'};
 const source=r.pages.length?`Лекции курса, страницы PDF: ${r.pages.join(', ')}.`:'Проверка по условию и указанным источникам.';
 const links=(r.external||[]).map(([title,url])=>`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(title)}</a>`).join(' · ');
 return `<section class="answer-review review-${r.status}" data-answer-review="${q.id}" aria-label="Результат проверки ответа"><h3>${titles[r.status]||'Проверка ответа'}</h3><p>${esc(r.note)}</p><p class="review-source">${esc(source)}${links?' '+links:''}</p></section>`;
}
function solvedStatus(q){
 let cls='',title='Ещё не решён';
 if(q.basis==='unavailable')title='Без оценки — нет оригинала';
 else if(state.checked[q.id]){cls=valid(q)?'good':'bad';title=valid(q)?'Правильно':'Неправильно';title+=q.correction?' · исправленный ключ':' · проверенный ключ';}
 else if(started(q))title='Ответ не проверен';
 return `<div class="solved-status ${cls}" data-solved-status="${q.id}" role="status"><strong>${title}</strong></div>`;
}

function renderAllAnswers(){
 const questions=list();
 if(!questions.length){$('content').innerHTML='<div class="empty"><h2>Нет подходящих вопросов</h2><p class="muted">Измените поиск или выберите «Все вопросы».</p></div>';return;}
 $('content').innerHTML='<div class="answer-sheet">'+questions.map(q=>{
  const unavailable=q.basis==='unavailable',guess=q.basis==='guess';
  let answers='';
  if(q.type==='radio')answers='<ul class="answer-options">'+q.options.map((o,i)=>{
   const chosen=q.answer.includes(i);
   const label=optionInfo(q,i);
   return `<li class="answer-option ${chosen?(unavailable?'is-unconfirmed':'is-answer'):''}"><span>${esc(o)}</span>${label?`<div class="answer-info">${esc(label)}</div>`:''}${chosen?illustration(q):''}</li>`;
  }).join('')+'</ul>';
  else if(q.type==='text')answers=`<div class="answer-text ${guess?'guess':''}">${guess?'Моя гипотеза':'Ответ'}: <strong>${esc(q.answer.join(' / '))}</strong></div>`;
  else answers='<dl class="answer-pairs">'+q.rows.map((r,i)=>`<div class="answer-pair"><dt>${esc(r.left.startsWith('[Изображения')?`Изображение ${i+1} отсутствует в PDF`:r.left)}</dt><dd>${unavailable?(r.answer.length?'Справочно, не подтверждено: '+esc(leaders(q,r)):'Ответ не восстановлен'):esc(leaders(q,r))}</dd>${!unavailable&&r.answer.length>1?'<div class="answer-info">Допустим любой указанный вариант.</div>':''}</div>`).join('')+'</dl>';
  const note=unavailable?`<div class="note">${esc(q.reason)}</div>`:guess?'<div class="note guess">Моя гипотеза: статистики для этого вопроса нет.</div>':q.missingImage?'<div class="note">Изображения нет в PDF. Ответ выбран по статистике.</div>':'';
  const explanation=guess?`<div class="answer-explanation">${esc(q.reason)}<p>Уверенность: ${esc(q.confidence)}.</p></div>`:!unavailable&&q.type!=='match'&&q.answer?.length>1?'<p class="answer-explanation">Показаны допустимые варианты ответа.</p>':'';
  return `<article id="question-${q.id}" class="answer-question ${q.basis}" data-question="${q.id}">${solvedStatus(q)}<div class="meta"><strong>Вопрос ${q.id}</strong>${badge(q)}<span>${q.type==='radio'?'Один ответ':q.type==='text'?'Ввод ответа':'Соответствие'}</span></div><h2>${esc(q.prompt)}</h2>${note}${optionGuide(q)}${answers}${q.type!=='radio'?illustration(q):''}${illustrationNote(q)}${explanation}${answerReview(q)}</article>`;
 }).join('')+'</div>';
}

function render(){document.body.classList.toggle('answer-mode',!!state.reveal&&state.view!=='results');const paneScroll=$('content').dataset.current===String(state.current)?Array.from(document.querySelectorAll('.question-body,.solution-panel'),el=>el.scrollTop):[];$('reveal').textContent=state.reveal?'К тесту':'Все ответы';$('reveal').setAttribute('aria-label',state.reveal?'Вернуться к тесту':'Показать все ответы');$('reveal').setAttribute('aria-pressed',String(!!state.reveal));$('answer-mode').classList.toggle('hidden',!state.reveal);refreshNav();if(state.view==='results'){renderResults();return;}if(state.reveal){renderAllAnswers();return;}const arr=list();let q=arr.find(q=>q.id===state.current);if(!q){q=arr[0];if(q)state.current=q.id;refreshNav();}if(!q){$('content').innerHTML='<div class="question empty"><h2>Нет подходящих вопросов</h2><p class="muted">Измените поиск или выберите «Все вопросы».</p></div>';return;}$('content').dataset.current=q.id;const checked=!!state.checked[q.id]||!!state.reveal,a=answer(q);let fields='';if(q.type==='radio')fields=`<div class="choices" role="radiogroup" aria-labelledby="question-title">${q.options.map((o,i)=>`<label class="option ${checked&&q.basis!=='unavailable'&&q.answer.includes(i)?'correct':checked&&a===i&&!q.answer.includes(i)&&q.basis!=='unavailable'?'wrong':''}"><input type="radio" name="answer" value="${i}" ${a===i?'checked':''}><span class="text">${esc(o)}${checked?`<span class="vote">${optionInfo(q,i)}</span>`:''}${checked&&a===i?`<span class="choice-feedback">${selectionMessage(q)}</span>`:''}</span></label>`).join('')}</div>`;
else if(q.type==='text')fields=`<label class="small muted" for="text-answer">Ваш ответ</label><input id="text-answer" class="text-answer" type="text" autocomplete="off" value="${esc(a||'')}" placeholder="Введите ответ">${checked?voteTable(q):''}`;
else fields=`<div class="matching">${q.rows.map((r,i)=>{const av=Array.isArray(a)?a[i]:null;return `<div class="match-row"><label for="match-${i}">${esc(r.left.startsWith('[Изображения')?`Изображение ${i+1} отсутствует в PDF`:r.left)}</label><select id="match-${i}" data-row="${i}" aria-label="${esc(r.left.startsWith('[Изображения')?`Ответ к изображению ${i+1}`:r.left)}"><option value="">Выберите соответствие</option>${q.options.map((o,j)=>`<option value="${j}" ${av===j?'selected':''}>${esc(o)}</option>`).join('')}</select><div class="selected-full" id="selected-${i}">${Number.isInteger(av)?esc(q.options[av]):''}</div>${checked&&q.basis!=='unavailable'?`<div class="row-result ${state.reveal&&!state.checked[q.id]?'good':r.answer.includes(av)?'good':'bad'}">${state.reveal&&!state.checked[q.id]?'Ответ':r.answer.includes(av)?'Совпало':'Не совпало'} · Проверенный ответ: <strong>${esc(leaders(q,r))}</strong>${r.answer.length>1?' · допустимые варианты':''}</div>${r.votes.some(v=>v>0)?`<details><summary>Голоса по этой строке</summary>${voteTable(q,r)}</details>`:''}`:''}</div>`;}).join('')}</div>`;
const pos=arr.indexOf(q);const notice=q.basis==='guess'?`<div class="note guess">Нет статистики. Ответ предложен мной и учитывается отдельно как гипотеза.${q.missingImage?' Изображение отсутствует, поэтому уверенность ограничена.':''}</div>`:q.basis==='unavailable'?`<div class="note">${esc(q.reason)} Этот вопрос сохранён, но исключён из оценки.</div>`:q.missingImage?'<div class="note">Изображение отсутствует в исходном PDF. Ключ восстановлен только по числу голосов.</div>':'';
let unresolved='';if(checked&&q.unassignedVotes?.length)unresolved=`<details><summary>Сохранившаяся статистика без привязки к строкам</summary><table><thead><tr><th>Вариант</th><th>Голоса</th></tr></thead><tbody>${q.unassignedVotes.map(v=>`<tr><td>${esc(q.options[v.option])}</td><td>${v.votes}</td></tr>`).join('')}</tbody></table></details>`;
$('content').innerHTML=`<nav class="actions question-actions" aria-label="Действия с вопросом">${solvedStatus(q)}<button id="prev" ${pos===0?'disabled':''}>Назад</button><button id="check" class="primary ${q.type==='radio'?'automatic-check':''}" ${q.type==='radio'?'aria-hidden="true" tabindex="-1" disabled':''}>${q.basis==='unavailable'?'Показать пояснение':checked?'Проверено':'Проверить ответ'}</button><button id="next" ${pos===arr.length-1?'disabled':''}>Дальше</button></nav><article class="question question-workspace"><section class="question-body" tabindex="0" aria-label="Вопрос и варианты ответа"><div class="meta"><strong>Вопрос ${q.id} из 212</strong>${badge(q)}<span>${q.type==='radio'?'Один ответ':q.type==='text'?'Ввод ответа':'Соответствие'}</span></div><h2 id="question-title">${esc(q.prompt)}</h2>${q.clarification?`<div class="note">${esc(q.clarification)}</div>`:''}${notice}${ILLUSTRATIONS[q.id]?illustration(q,'question'):''}${optionGuide(q)}${fields}${arr.length!==212?`<div class="below">В подборке: ${pos+1} из ${arr.length}</div>`:''}</section><section class="solution-panel ${checked?'has-solution':''}" tabindex="0" aria-label="Пояснение к ответу"><h3>Пояснение</h3>${checked?`${feedback(q)}${illustration(q)}${illustrationNote(q)}${answerReview(q)}${unresolved}`:'<p class="solution-placeholder">Появится после проверки ответа.</p>'}</section></article>`;
$('check').onclick=()=>{if(q.basis!=='unavailable'&&!filled(q)){$('announce').textContent=q.type==='match'?'Выберите ответ для каждой строки.':'Сначала выберите или введите ответ.';return;}state.checked[q.id]=true;save();render();$('check').focus({preventScroll:true});};$('prev').onclick=()=>go(arr[pos-1].id);$('next').onclick=()=>go(arr[pos+1].id);
document.querySelectorAll('input[name=answer]').forEach(el=>el.onchange=()=>update(q,Number(el.value)));
if(q.type==='text')$('text-answer').oninput=e=>update(q,e.target.value,true);
document.querySelectorAll('[data-row]').forEach(el=>el.onchange=()=>{const values=Array.isArray(answer(q))?[...answer(q)]:Array(q.rows.length).fill(null);values[Number(el.dataset.row)]=el.value===''?null:Number(el.value);update(q,values);});
document.querySelectorAll('.question-body,.solution-panel').forEach((el,i)=>{el.scrollTop=paneScroll[i]||0;});
}
function update(q,value,keepFocus=false){const focusedId=document.activeElement?.id;state.answers[q.id]=value;const wasChecked=state.checked[q.id];if(q.type==='radio')state.checked[q.id]=true;else delete state.checked[q.id];$('announce').textContent='';save();if(keepFocus&&!wasChecked){refreshNav();return;}if(keepFocus){const pos=$('text-answer').selectionStart;render();if($('text-answer')){$('text-answer').focus({preventScroll:true});$('text-answer').setSelectionRange(pos,pos);}}else{render();const control=q.type==='radio'?document.querySelector('input[name=answer][value="'+value+'"]'):focusedId?document.getElementById(focusedId):null;if(control)control.focus({preventScroll:true});}}
function go(id){
 closeMenu();
 const previousTop=document.querySelector('.question-actions')?.getBoundingClientRect().top;
 state.current=id;state.view='quiz';$('announce').textContent='';save();render();
 if(state.reveal){$('question-'+id)?.scrollIntoView({block:'start',behavior:'instant'});return;}
 const toolbar=document.querySelector('.question-actions');
 if(toolbar&&!matchMedia('(min-width:1024px) and (hover:hover) and (pointer:fine)').matches){const contentTop=$('content').getBoundingClientRect().top+window.scrollY;window.scrollTo({top:Math.max(0,contentTop-(previousTop??0)),behavior:'instant'});}
}
function renderResults(){
 const scored=DATA.filter(q=>q.basis!=='unavailable'),unscored=DATA.length-scored.length;
 const correct=scored.filter(q=>valid(q)===true).length,attempts=scored.filter(filled).length;
 $('content').innerHTML=`<section class="question"><h2>Результат попытки</h2><p class="muted">Оценка по проверенным ключам курса. Вопросы без исходных изображений не влияют на результат.</p><div class="result-line"><span>Правильно</span><strong>${correct} / ${scored.length}</strong></div><div class="result-line"><span>Неправильно</span><strong>${attempts-correct}</strong></div><div class="result-line"><span>Не заполнено среди оцениваемых вопросов</span><strong>${scored.length-attempts}</strong></div><div class="result-line"><span>Нет полного подтверждения ключа</span><strong>${unscored} · без оценки</strong></div><div class="result-actions"><button class="primary" id="resume">Продолжить тест</button><button id="review-errors">Разобрать ошибки</button><button id="review-unavailable">Вопросы без оценки</button></div><p class="below">При неполном соответствии вопрос считается незаполненным. Полный вопрос засчитывается при совпадении всех его строк.</p></section>`;
 $('resume').onclick=()=>{state.view='quiz';render();};$('review-errors').onclick=()=>filter('errors');$('review-unavailable').onclick=()=>filter('unavailable');
}
function filter(value){closeMenu();if(value==='errors')state.reviewIds=DATA.filter(q=>state.checked[q.id]&&filled(q)&&valid(q)===false).map(q=>q.id);state.filter=value;state.search='';state.view='quiz';$('search').value='';save();render();showSearchResults();}
function closeMenu(){
 $('settings-panel').classList.add('hidden');$('menu-toggle').setAttribute('aria-expanded','false');$('reset-confirm').classList.add('hidden');
}
$('menu-toggle').onclick=()=>{const open=$('settings-panel').classList.contains('hidden');if(open){$('settings-panel').classList.remove('hidden');$('menu-toggle').setAttribute('aria-expanded','true');}else closeMenu();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('settings-panel').classList.contains('hidden')){closeMenu();$('menu-toggle').focus();}});
document.addEventListener('click',e=>{if(!e.target.closest('#settings-panel,#menu-toggle'))closeMenu();});
$('search').onfocus=()=>closeMenu();
$('reveal').onclick=()=>{closeMenu();state.reveal=!state.reveal;state.view='quiz';if(state.reveal){state.filter='all';state.search='';$('search').value='';}save();render();showSearchResults();};
$('filters').onclick=e=>{const b=e.target.closest('[data-filter]');if(b)filter(b.dataset.filter);};$('search').oninput=e=>{state.search=e.target.value;state.filter='all';state.view='quiz';render();showSearchResults();};$('search').onkeydown=e=>{if(e.key==='Enter'&&list().length){go(list()[0].id);$('search-results').classList.add('hidden');}if(e.key==='Escape'){e.preventDefault();state.search='';$('search').value='';render();showSearchResults();}};$('search-results').onclick=e=>{const b=e.target.closest('[data-result]');if(b){go(Number(b.dataset.result));$('search-results').classList.add('hidden');}};$('numbers').onclick=e=>{const b=e.target.closest('[data-id]');if(b)go(Number(b.dataset.id));};$('finish').onclick=()=>{closeMenu();DATA.forEach(q=>{if(started(q))state.checked[q.id]=true;});state.view='results';save();render();if(!matchMedia('(min-width:1024px) and (hover:hover) and (pointer:fine)').matches)$('main').scrollIntoView({block:'start',behavior:'instant'});};$('reset').onclick=()=>$('reset-confirm').classList.remove('hidden');$('reset-no').onclick=()=>$('reset-confirm').classList.add('hidden');$('reset-yes').onclick=()=>{closeMenu();state={current:1,answers:{},checked:{},filter:'all',search:'',view:'quiz',reveal:false};$('search').value='';$('reset-confirm').classList.add('hidden');save();render();showSearchResults();};

render();
</script></body></html>
