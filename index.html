<script>
'use strict';
const ANSWER_REVIEWS=JSON.parse(document.getElementById("answer-review-data").textContent);
const ILLUSTRATIONS=JSON.parse(document.getElementById("illustration-data").textContent);
const DATA=JSON.parse(document.getElementById('quiz-data').textContent);
const STORE='syncshare-938416-v1';
let state={current:1,answers:{},checked:{},filter:'all',search:'',view:'quiz',reveal:false};
try{const s=JSON.parse(localStorage.getItem(STORE)||'null');if(s&&s.version===1)state={...state,...s,view:'quiz',filter:'all',search:''};}catch{}
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').trim().toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ');
function answer(q){return state.answers[q.id];}
function filled(q){const a=answer(q);return q.type==='match'?Array.isArray(a)&&q.rows.every((_,i)=>Number.isInteger(a[i])):q.type==='radio'?Number.isInteger(a):typeof a==='string'&&a.trim()!=='';}
function started(q){const a=answer(q);return q.type==='match'?Array.isArray(a)&&a.some(x=>Number.isInteger(x)):q.type==='radio'?Number.isInteger(a):typeof a==='string'&&a.trim()!=='';}
function valid(q){if(q.basis==='unavailable')return null;const a=answer(q);if(!filled(q))return false;if(q.type==='match')return q.rows.every((r,i)=>r.answer.includes(a[i]));if(q.type==='text')return q.answer.some(x=>norm(x)===norm(a));return q.answer.includes(a);}
function save(){try{localStorage.setItem(STORE,JSON.stringify({...state,version:1}));$('save-state').textContent='Прогресс сохранён в этом браузере';}catch{$('save-state').textContent='Сохранение недоступно — не закрывайте вкладку';}}
function searchMatches(q,text){
 const numbered=text.match(/^(?:№\s*|вопрос\s*)?(\d+)$/);
 if(numbered)return q.id===Number(numbered[1]);
 const haystack=norm(q.prompt+' '+q.options.join(' ')+' '+(q.rows||[]).map(r=>r.left).join(' ')+' '+(q.candidates||[]).map(c=>c.value).join(' ')).replace(/[^\p{L}\p{N}]+/gu,' ');
 return text.split(/[^\p{L}\p{N}]+/u).filter(Boolean).every(word=>haystack.includes(word));
}
function list(){const text=norm(state.search);return DATA.filter(q=>text?searchMatches(q,text):(state.filter==='all'||state.filter===q.basis||(state.filter==='errors'&&(state.reviewIds||[]).includes(q.id))));}
function showSearchResults(){
 const text=norm(state.search),arr=list();
 $('search-status').textContent=text?`Найдено: ${arr.length}`:'';
 $('search-results').classList.toggle('hidden',!text);
 $('search-results').innerHTML=text?arr.map(q=>`<button data-result="${q.id}"><strong>№ ${q.id}</strong><span>${esc(q.prompt.length>180?q.prompt.slice(0,180)+'…':q.prompt)}</span></button>`).join(''):'';
}
function refreshNav(){const n=DATA.filter(filled).length;const errors=DATA.filter(q=>state.checked[q.id]&&filled(q)&&valid(q)===false).length;$('progress-text').textContent=`Заполнено ${n} из 212`;$('bar').style.width=(n/212*100)+'%';$('error-count').textContent=errors;const arr=list();$('nav-count').textContent=`(${arr.length})`;$('numbers').innerHTML=arr.map(q=>{const v=state.checked[q.id]?valid(q):null;const cls=[q.id===state.current?'current':'',q.basis==='guess'?'hyp':'',v===true?'yes':v===false&&filled(q)?'no':started(q)?'done':''].join(' ');return `<button class="${cls}" data-id="${q.id}" aria-label="Вопрос ${q.id}${q.basis==='guess'?', моя гипотеза':''}${state.checked[q.id]&&filled(q)?v===true?', совпал с ключом':v===false?', не совпал с ключом':'':''}" ${q.id===state.current?'aria-current="true"':''}>${q.id}</button>`;}).join('');document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('active',b.dataset.filter===state.filter);b.setAttribute('aria-pressed',String(b.dataset.filter===state.filter));});}
function badge(q){return `<span class="badge ${q.basis}">${q.basis==='guess'?'Моя гипотеза':q.basis==='unavailable'?'Нет ключа':q.correction?'Ключ исправлен':'По статистике'}</span>`;}
function leaders(q,r=q){return r.answer.map(i=>q.options[i]).join(' / ');}
function voteTable(q,r=q){const rows=q.type==='text'?q.candidates:q.options.map((o,i)=>({value:o,votes:r.votes[i]}));return `<table><thead><tr><th scope="col">Вариант</th><th scope="col">Голоса</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.value)}</td><td>${r.votes}</td></tr>`).join('')}</tbody></table>`;}
function feedback(q){if(!state.checked[q.id]&&!state.reveal)return '';const revealing=state.reveal&&!state.checked[q.id];const v=valid(q);if(q.basis==='unavailable')return `<div class="feedback"><strong>Без оценки</strong><p>${esc(q.reason)}</p></div>`;const cls=q.basis==='guess'?'hypothesis':revealing?'good':v?'good':'bad';const heading=revealing?(q.basis==='guess'?'Моя гипотеза':'Ответ по статистике'):!filled(q)?'Ответ не заполнен':q.basis==='guess'?(v?'Совпало с моей гипотезой':'Не совпало с моей гипотезой'):(q.correction?(v?'Правильно по исправленному ключу':'Неправильно по исправленному ключу'):(v?'Совпало со статистикой':'Не совпало со статистикой'));let details='';if(q.type!=='match')details=`<p>${q.basis==='guess'?'Моя гипотеза':'Лидер голосования'}: <strong>${esc(q.type==='text'?q.answer.join(' / '):leaders(q))}</strong></p>`;if(q.basis==='guess')details+=`<p>${esc(q.reason)}</p><p class="small">Уверенность: ${esc(q.confidence)}. Это мой вывод, а не ответ из статистики.${q.source?` <a href="${esc(q.source)}" target="_blank" rel="noopener">Основание</a>`:''}</p>`;else if((q.answer||[]).length>1||q.rows?.some(r=>r.answer.length>1))details+='<p class="small">Есть равенство максимальных голосов. Засчитывается любой из лидеров соответствующей строки.</p>';return `<div class="feedback ${cls}" role="status"><h3>${heading}</h3>${details}</div>`;}

function illustration(q,placement='answer'){
 const f=ILLUSTRATIONS[q.id];
 if(!f)return '';
 const inQuestion=placement==='question';
 return `<figure class="answer-figure ${inQuestion?'question-figure':''}" data-illustration="${q.id}" data-illustration-role="${placement}"><span class="figure-badge">Создано по ответу</span><img src="${f.src}" alt="${esc(f.title+'. '+f.description)}" width="420" height="${[34,165,192].includes(q.id)?290:[22,46,121].includes(q.id)?260:q.id===131?250:240}" loading="lazy" decoding="async"><figcaption>${inQuestion?'':`<strong>${esc(f.title)}</strong>${esc(f.description)}`}<span class="figure-origin">${inQuestion?'Учебная реконструкция. Оригинал в PDF отсутствует.':'Учебная иллюстрация по ответу. Оригинальная картинка в PDF отсутствует.'}</span></figcaption></figure>`;
}
function selectionMessage(q){
 if(q.basis==='unavailable')return 'Без оценки: ключ отсутствует.';
 if(q.basis==='guess')return valid(q)?'Совпало с моей гипотезой.':'Не совпало с моей гипотезой.';
 return valid(q)?'Совпало со статистикой.':'Не совпало со статистикой.';
}
function illustrationNote(q){
 if(!q.missingImage||q.basis!=='votes'||ILLUSTRATIONS[q.id])return '';
 return `<p class="figure-note">${q.answer?.length>1?'Есть ничья по голосам, поэтому единственная иллюстрация не выбрана.':'Лидер голосования не подтверждён отметкой «Правильно» в PDF. Без оригинала нельзя уверенно восстановить изображение.'} Ключ по статистике сохранён.</p>`;
}

function answerReview(q){
 if(q.correction)return `<section class="answer-review review-ok" data-key-correction="${q.id}" aria-label="Исправление ключа"><h3>Ключ исправлен по учебным материалам</h3><p>${esc(q.correction)}</p></section>`;
 const r=ANSWER_REVIEWS[q.id];if(!r)return '';
 const titles={ok:'Проверка: ответ подтверждён',error:'В ключе по статистике найдена ошибка',caveat:'Проверка: есть оговорка',missing:'Для проверки нужна исходная картинка',partial:'Ответ проверен частично'};
 const source=r.pages.length?`Лекции курса, страницы PDF: ${r.pages.join(', ')}.`:'Проверено вычислением по условию.';
 return `<section class="answer-review review-${r.status}" data-answer-review="${q.id}" aria-label="Проверка ответа с одним голосом"><h3>${titles[r.status]}</h3><p>${esc(r.note)}</p>${r.status==='error'?'<p class="review-scoring">Ключ не изменён: результат попытки по-прежнему считается по исходной статистике.</p>':''}<p class="review-source">Проверка ответов с максимумом в 1 голос. ${esc(source)}</p></section>`;
}

function solvedStatus(q){
 let cls='',title='Ещё не решён';
 if(q.basis==='unavailable')title='Без оценки — нет ключа';
 else if(state.checked[q.id]){cls=valid(q)?'good':'bad';title=valid(q)?'Правильно':'Неправильно';title+=q.basis==='guess'?' · по гипотезе':q.correction?' · исправленный ключ':' · по ключу статистики';}
 else if(started(q))title='Ответ не проверен';
 return `<div class="solved-status ${cls}" data-solved-status="${q.id}" role="status"><strong>${title}</strong></div>`;
}

function renderAllAnswers(){
 const questions=list();
 if(!questions.length){$('content').innerHTML='<div class="empty"><h2>Нет подходящих вопросов</h2><p class="muted">Измените поиск или выберите «Все вопросы».</p></div>';return;}
 $('content').innerHTML='<div class="answer-sheet">'+questions.map(q=>{
  const unavailable=q.basis==='unavailable',guess=q.basis==='guess';
  let answers='';
  if(q.type==='radio')answers='<ul class="answer-options">'+q.options.map((o,i)=>{
   const chosen=!unavailable&&q.answer.includes(i);
   const label=unavailable?'Нет данных':guess?(chosen?'Моя гипотеза':''):`${q.votes[i]} голосов${chosen?' · ответ по статистике':''}`;
   return `<li class="answer-option ${chosen?(guess?'is-guess':'is-answer'):''}"><span>${esc(o)}</span>${label?`<div class="answer-info">${esc(label)}</div>`:''}${chosen?illustration(q):''}</li>`;
  }).join('')+'</ul>';
  else if(q.type==='text')answers=`<div class="answer-text ${guess?'guess':''}">${guess?'Моя гипотеза':'Ответ'}: <strong>${esc(q.answer.join(' / '))}</strong></div>`;
  else answers='<dl class="answer-pairs">'+q.rows.map((r,i)=>`<div class="answer-pair"><dt>${esc(r.left.startsWith('[Изображения')?`Изображение ${i+1} отсутствует в PDF`:r.left)}</dt><dd>${unavailable?'Ответ не восстановлен':esc(leaders(q,r))}</dd>${!unavailable&&r.answer.length>1?'<div class="answer-info">Равенство голосов — несколько лидеров.</div>':''}</div>`).join('')+'</dl>';
  const note=unavailable?`<div class="note">${esc(q.reason)}</div>`:guess?'<div class="note guess">Моя гипотеза: статистики для этого вопроса нет.</div>':q.missingImage?'<div class="note">Изображения нет в PDF. Ответ выбран по статистике.</div>':'';
  const explanation=guess?`<div class="answer-explanation">${esc(q.reason)}<p>Уверенность: ${esc(q.confidence)}.</p></div>`:q.type!=='match'&&q.answer?.length>1?'<p class="answer-explanation">Равенство голосов — показаны все лидеры.</p>':'';
  return `<article id="question-${q.id}" class="answer-question ${q.basis}" data-question="${q.id}">${solvedStatus(q)}<div class="meta"><strong>Вопрос ${q.id}</strong>${badge(q)}<span>${q.type==='radio'?'Один ответ':q.type==='text'?'Ввод ответа':'Соответствие'}</span></div><h2>${esc(q.prompt)}</h2>${note}${answers}${q.type!=='radio'?illustration(q):''}${illustrationNote(q)}${explanation}${answerReview(q)}</article>`;
 }).join('')+'</div>';
}

function render(){document.body.classList.toggle('answer-mode',!!state.reveal&&state.view!=='results');const paneScroll=$('content').dataset.current===String(state.current)?Array.from(document.querySelectorAll('.question-body,.solution-panel'),el=>el.scrollTop):[];$('reveal').textContent=state.reveal?'К тесту':'Все ответы';$('reveal').setAttribute('aria-label',state.reveal?'Вернуться к тесту':'Показать все ответы');$('reveal').setAttribute('aria-pressed',String(!!state.reveal));$('answer-mode').classList.toggle('hidden',!state.reveal);refreshNav();if(state.view==='results'){renderResults();return;}if(state.reveal){renderAllAnswers();return;}const arr=list();let q=arr.find(q=>q.id===state.current);if(!q){q=arr[0];if(q)state.current=q.id;refreshNav();}if(!q){$('content').innerHTML='<div class="question empty"><h2>Нет подходящих вопросов</h2><p class="muted">Измените поиск или выберите «Все вопросы».</p></div>';return;}$('content').dataset.current=q.id;const checked=!!state.checked[q.id]||!!state.reveal,a=answer(q);let fields='';if(q.type==='radio')fields=`<div class="choices" role="radiogroup" aria-labelledby="question-title">${q.options.map((o,i)=>`<label class="option ${checked&&q.basis!=='unavailable'&&q.answer.includes(i)?'correct':checked&&a===i&&!q.answer.includes(i)&&q.basis!=='unavailable'?'wrong':''}"><input type="radio" name="answer" value="${i}" ${a===i?'checked':''}><span class="text">${esc(o)}${checked?`<span class="vote">${q.basis==='guess'?(q.answer.includes(i)?'Моя гипотеза':'Без статистики'):q.basis==='unavailable'?'Нет данных':`${q.votes[i]} голосов${q.answer.includes(i)?' · ответ по статистике':''}`}</span>`:''}${checked&&a===i?`<span class="choice-feedback">${selectionMessage(q)}</span>`:''}</span></label>`).join('')}</div>`;
else if(q.type==='text')fields=`<label class="small muted" for="text-answer">Ваш ответ</label><input id="text-answer" class="text-answer" type="text" autocomplete="off" value="${esc(a||'')}" placeholder="Введите ответ">${checked?voteTable(q):''}`;
else fields=`<div class="matching">${q.rows.map((r,i)=>{const av=Array.isArray(a)?a[i]:null;return `<div class="match-row"><label for="match-${i}">${esc(r.left.startsWith('[Изображения')?`Изображение ${i+1} отсутствует в PDF`:r.left)}</label><select id="match-${i}" data-row="${i}" aria-label="${esc(r.left.startsWith('[Изображения')?`Ответ к изображению ${i+1}`:r.left)}"><option value="">Выберите соответствие</option>${q.options.map((o,j)=>`<option value="${j}" ${av===j?'selected':''}>${esc(o)}</option>`).join('')}</select><div class="selected-full" id="selected-${i}">${Number.isInteger(av)?esc(q.options[av]):''}</div>${checked&&q.basis!=='unavailable'?`<div class="row-result ${state.reveal&&!state.checked[q.id]?'good':r.answer.includes(av)?'good':'bad'}">${state.reveal&&!state.checked[q.id]?'Ответ':r.answer.includes(av)?'Совпало':'Не совпало'} · ${q.basis==='guess'?'Моя гипотеза':q.correction?'Проверенный ответ':'Максимум голосов'}: <strong>${esc(leaders(q,r))}</strong>${r.answer.length>1?' · равенство голосов':''}</div>${q.basis==='votes'?`<details><summary>Голоса по этой строке</summary>${voteTable(q,r)}</details>`:''}`:''}</div>`;}).join('')}</div>`;
const pos=arr.indexOf(q);const notice=q.basis==='guess'?`<div class="note guess">Нет статистики. Ответ предложен мной и учитывается отдельно как гипотеза.${q.missingImage?' Изображение отсутствует, поэтому уверенность ограничена.':''}</div>`:q.basis==='unavailable'?`<div class="note">${esc(q.reason)} Этот вопрос сохранён, но исключён из оценки.</div>`:q.missingImage?'<div class="note">Изображение отсутствует в исходном PDF. Ключ восстановлен только по числу голосов.</div>':'';
let unresolved='';if(checked&&q.unassignedVotes?.length)unresolved=`<details><summary>Сохранившаяся статистика без привязки к строкам</summary><table><thead><tr><th>Вариант</th><th>Голоса</th></tr></thead><tbody>${q.unassignedVotes.map(v=>`<tr><td>${esc(q.options[v.option])}</td><td>${v.votes}</td></tr>`).join('')}</tbody></table></details>`;
$('content').innerHTML=`<nav class="actions question-actions" aria-label="Действия с вопросом">${solvedStatus(q)}<button id="prev" ${pos===0?'disabled':''}>Назад</button><button id="check" class="primary ${q.type==='radio'?'automatic-check':''}" ${q.type==='radio'?'aria-hidden="true" tabindex="-1" disabled':''}>${q.basis==='unavailable'?'Показать пояснение':checked?'Проверено':'Проверить ответ'}</button><button id="next" ${pos===arr.length-1?'disabled':''}>Дальше</button></nav><article class="question question-workspace"><section class="question-body" tabindex="0" aria-label="Вопрос и варианты ответа"><div class="meta"><strong>Вопрос ${q.id} из 212</strong>${badge(q)}<span>${q.type==='radio'?'Один ответ':q.type==='text'?'Ввод ответа':'Соответствие'}</span></div><h2 id="question-title">${esc(q.prompt)}</h2>${ILLUSTRATIONS[q.id]?illustration(q,'question'):notice}${fields}${arr.length!==212?`<div class="below">В подборке: ${pos+1} из ${arr.length}</div>`:''}</section><section class="solution-panel ${checked?'has-solution':''}" tabindex="0" aria-label="Пояснение к ответу"><h3>Пояснение</h3>${checked?`${feedback(q)}${illustration(q)}${illustrationNote(q)}${answerReview(q)}${unresolved}`:'<p class="solution-placeholder">Появится после проверки ответа.</p>'}</section></article>`;
$('check').onclick=()=>{if(q.basis!=='unavailable'&&!filled(q)){$('announce').textContent=q.type==='match'?'Выберите ответ для каждой строки.':'Сначала выберите или введите ответ.';return;}state.checked[q.id]=true;save();render();$('check').focus({preventScroll:true});};$('prev').onclick=()=>go(arr[pos-1].id);$('next').onclick=()=>go(arr[pos+1].id);
document.querySelectorAll('input[name=answer]').forEach(el=>el.onchange=()=>update(q,Number(el.value)));
if(q.type==='text')$('text-answer').oninput=e=>update(q,e.target.value,true);
document.querySelectorAll('[data-row]').forEach(el=>el.onchange=()=>{const values=Array.isArray(answer(q))?[...answer(q)]:Array(q.rows.length).fill(null);values[Number(el.dataset.row)]=el.value===''?null:Number(el.value);update(q,values);});
document.querySelectorAll('.question-body,.solution-panel').forEach((el,i)=>{el.scrollTop=paneScroll[i]||0;});
}
function update(q,value,keepFocus=false){const focusedId=document.activeElement?.id;state.answers[q.id]=value;const wasChecked=state.checked[q.id];if(q.type==='radio')state.checked[q.id]=true;else delete state.checked[q.id];$('announce').textContent='';save();if(keepFocus&&!wasChecked){refreshNav();return;}if(keepFocus){const pos=$('text-answer').selectionStart;render();if($('text-answer')){$('text-answer').focus({preventScroll:true});$('text-answer').setSelectionRange(pos,pos);}}else{render();const control=q.type==='radio'?document.querySelector('input[name=answer][value="'+value+'"]'):focusedId?document.getElementById(focusedId):null;if(control)control.focus({preventScroll:true});}}
function go(id){
 closeMenu();
 const previousTop=document.querySelector('.question-actions')?.getBoundingClientRect().top;
 state.current=id;state.view='quiz';$('announce').textContent='';save();render();
 if(state.reveal){$('question-'+id)?.scrollIntoView({block:'start',behavior:'instant'});return;}
 const toolbar=document.querySelector('.question-actions');
 if(toolbar&&!matchMedia('(min-width:1024px) and (hover:hover) and (pointer:fine)').matches){const contentTop=$('content').getBoundingClientRect().top+window.scrollY;window.scrollTo({top:Math.max(0,contentTop-(previousTop??0)),behavior:'instant'});}
}
function renderResults(){const votes=DATA.filter(q=>q.basis==='votes'),guesses=DATA.filter(q=>q.basis==='guess');const correct=arr=>arr.filter(q=>valid(q)===true).length,attempts=arr=>arr.filter(filled).length;$('content').innerHTML=`<section class="question"><h2>Результат попытки</h2><p class="muted">Оценка по ключам теста: статистика с исправлением вопроса №9. Гипотезы показаны отдельно.</p><div class="result-line"><span>Правильно по основным ключам</span><strong>${correct(votes)} / ${votes.length}</strong></div><div class="result-line"><span>Неправильно по основным ключам</span><strong>${attempts(votes)-correct(votes)}</strong></div><div class="result-line"><span>Не заполнено среди основных вопросов</span><strong>${votes.length-attempts(votes)}</strong></div><div class="result-line"><span>Совпало с моими гипотезами</span><strong>${correct(guesses)} / ${guesses.length}</strong></div><div class="result-line"><span>Гипотезы: заполнено</span><strong>${attempts(guesses)} / 7</strong></div><div class="result-line"><span>Без ключа из-за отсутствующих изображений</span><strong>18 · без оценки</strong></div><div class="result-actions"><button class="primary" id="resume">Продолжить тест</button><button id="review-errors">Разобрать ошибки</button><button id="review-guesses">Посмотреть гипотезы</button></div><p class="below">При неполном соответствии вопрос считается незаполненным. Полный вопрос засчитывается при совпадении всех его строк.</p></section>`;$('resume').onclick=()=>{state.view='quiz';render();};$('review-errors').onclick=()=>filter('errors');$('review-guesses').onclick=()=>filter('guess');}
function filter(value){closeMenu();if(value==='errors')state.reviewIds=DATA.filter(q=>state.checked[q.id]&&filled(q)&&valid(q)===false).map(q=>q.id);state.filter=value;state.search='';state.view='quiz';$('search').value='';save();render();showSearchResults();}
function closeMenu(){
 $('settings-panel').classList.add('hidden');$('menu-toggle').setAttribute('aria-expanded','false');$('reset-confirm').classList.add('hidden');
}
$('menu-toggle').onclick=()=>{const open=$('settings-panel').classList.contains('hidden');if(open){$('settings-panel').classList.remove('hidden');$('menu-toggle').setAttribute('aria-expanded','true');}else closeMenu();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('settings-panel').classList.contains('hidden')){closeMenu();$('menu-toggle').focus();}});
document.addEventListener('click',e=>{if(!e.target.closest('#settings-panel,#menu-toggle'))closeMenu();});
$('search').onfocus=()=>closeMenu();
$('reveal').onclick=()=>{closeMenu();state.reveal=!state.reveal;state.view='quiz';if(state.reveal){state.filter='all';state.search='';$('search').value='';}save();render();showSearchResults();};
$('filters').onclick=e=>{const b=e.target.closest('[data-filter]');if(b)filter(b.dataset.filter);};$('search').oninput=e=>{state.search=e.target.value;state.filter='all';state.view='quiz';render();showSearchResults();};$('search').onkeydown=e=>{if(e.key==='Enter'&&list().length){go(list()[0].id);$('search-results').classList.add('hidden');}if(e.key==='Escape'){e.preventDefault();state.search='';$('search').value='';render();showSearchResults();}};$('search-results').onclick=e=>{const b=e.target.closest('[data-result]');if(b){go(Number(b.dataset.result));$('search-results').classList.add('hidden');}};$('numbers').onclick=e=>{const b=e.target.closest('[data-id]');if(b)go(Number(b.dataset.id));};$('finish').onclick=()=>{closeMenu();DATA.forEach(q=>{if(started(q))state.checked[q.id]=true;});state.view='results';save();render();if(!matchMedia('(min-width:1024px) and (hover:hover) and (pointer:fine)').matches)$('main').scrollIntoView({block:'start',behavior:'instant'});};$('reset').onclick=()=>$('reset-confirm').classList.remove('hidden');$('reset-no').onclick=()=>$('reset-confirm').classList.add('hidden');$('reset-yes').onclick=()=>{closeMenu();state={current:1,answers:{},checked:{},filter:'all',search:'',view:'quiz',reveal:false};$('search').value='';$('reset-confirm').classList.add('hidden');save();render();showSearchResults();};

render();
</script></body></html>
